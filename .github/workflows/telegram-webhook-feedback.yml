name: Record Telegram feedback

on:
  repository_dispatch:
    types: [telegram_feedback]

permissions:
  contents: write

# Same group as nightly-refresh.yml's concurrency block — tcg_prices.db
# is a shared release asset (download/edit/upload, not git-tracked), so
# without this, a feedback tap landing mid-nightly-run could upload its
# edit only to have the nightly job's own (older-based) upload silently
# clobber it afterward. Queuing this behind the nightly run instead of
# racing it means a tap during that window takes a few minutes longer to
# record, not that it gets lost.
concurrency:
  group: tcg-prices-db
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # record_feedback.py does its own download/edit/upload against the
      # tcg_prices.db release asset (see release_sync.py) — compare-and-
      # swap protected, so no separate download/upload steps are needed
      # here.
      - name: Record feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python record_feedback.py "${{ github.event.client_payload.rec_id }}" "${{ github.event.client_payload.verdict }}"
