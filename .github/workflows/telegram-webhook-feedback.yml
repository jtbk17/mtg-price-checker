name: Record Telegram feedback

on:
  repository_dispatch:
    types: [telegram_feedback]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Record feedback
        run: python record_feedback.py "${{ github.event.client_payload.rec_id }}" "${{ github.event.client_payload.verdict }}"

      - name: Commit feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tcg_prices.db
          git diff --cached --quiet || git commit -m "Record recommendation feedback"
          git pull --rebase
          git push
