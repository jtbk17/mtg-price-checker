name: Auction deals

# Checks every live TheTCGMarketplace Magic auction against GOG Cash and
# publishes docs/auctions.json (see auction_deals.py). Every 30 minutes,
# since bids move within hours; the whole check takes seconds. Also reads
# our own shop's listings, flagging ones that look sold (listing_sales.py).
# The Cloudflare Worker (cloudflare_worker.js) starts it every 30 minutes
# on time; GitHub's own schedule, which it often runs hours apart, stays
# as a backup.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Its own group, not the tcg-prices-db one the database jobs share:
# GitHub keeps only the newest waiting run per group, so a run every 30
# minutes there could cancel a waiting Refresh or Telegram-feedback run.
# It only writes docs/auctions.json, which nothing else touches, so the
# other jobs' pushes just rebase past it (see nightly-refresh.yml).
concurrency:
  group: auction-deals
  cancel-in-progress: true

jobs:
  auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests ijson

      # Read-only here: the all-cards db supplies each card's labels for
      # matching (set code, collector number, language) and is not
      # uploaded back.
      - name: Download the all-cards database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data --pattern "all_cards_*.db" --clobber

      - name: Check auctions and push docs/auctions.json (retries on conflict)
        env:
          # "Looks sold?" Telegram messages (sent once: python runs once, only the push retries)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python auction_deals.py

          # Regenerated wholesale, so on a push conflict just re-apply them
          # on top of whatever landed meanwhile.
          mkdir -p /tmp/out
          cp docs/auctions.json /tmp/out/
          [ -f docs/my_listings.json ] && cp docs/my_listings.json /tmp/out/
          [ -f docs/listing_sales.json ] && cp docs/listing_sales.json /tmp/out/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/out/*.json docs/
            for f in auctions my_listings listing_sales; do
              if [ -f "docs/$f.json" ]; then git add "docs/$f.json"; fi
            done
            git diff --cached --quiet && exit 0
            git commit -m "Auction deals"
            if git push; then
              exit 0
            fi
          done
          echo "Could not push docs/auctions.json after 3 attempts" >&2
          exit 1
