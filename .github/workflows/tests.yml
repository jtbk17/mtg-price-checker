name: Smoke tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt scikit-learn

      - run: python -m unittest test_smoke -v
