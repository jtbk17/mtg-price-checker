name: Nightly price refresh

on:
  schedule:
    # 07:00 UTC = 15:00 (3pm) SGT — MTGJSON's price feed refreshes ~06:00-06:10
    # UTC daily, so this runs after that day's fresh data actually lands
    # (the old 18:00 UTC / 2am SGT slot was pulling the *previous* day's prices)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# tcg_prices.db is NOT a git-tracked file (see below) — it's shared with
# telegram-webhook-feedback.yml, which downloads/edits/uploads the same
# release asset the instant someone taps a Telegram feedback button.
# Without this, that webhook landing mid-run here could upload its own
# edit, then get silently clobbered when this job uploads its own
# (older-based) copy at the end — real data loss, not just a conflict.
# Using the SAME group name in both workflow files makes GitHub Actions
# queue one run behind the other instead of letting them race.
concurrency:
  group: tcg-prices-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests ijson scikit-learn playwright anthropic python-dotenv

      # Needed by mtg_news.py to resolve Google News' redirect links,
      # which only resolve via client-side JS (a plain HTTP request just
      # gets Google's app-shell HTML, never the real article) — `--with-deps`
      # also installs the OS libraries the browser needs on this runner.
      - run: playwright install chromium --with-deps

      # Neither database is git-tracked (see .gitignore) — both grew past
      # git's practical size comfort (tcg_prices.db actually hit GitHub's
      # hard 100MB-per-file push limit, failing every push for two nights
      # straight), so both live as release assets instead, downloaded
      # fresh at the start of each run and uploaded back at the end.
      - name: Download existing databases, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data --pattern "tcg_prices.db" --clobber || true
          gh release download data --pattern "all_cards_*.db" --clobber || true

      # refresh_job.py/all_cards_history.py only do idempotent price
      # UPSERTs, and news_signals.py only records rows keyed by article
      # URL, so redoing any of this on a push conflict (e.g. a manual
      # push to docs/*.json landing mid-run) is harmless. Runs before
      # market_alerts.py so today's freshly-recorded signals are
      # available to the model when it scores today's movers.
      - name: Refresh price data and news signals, then push docs (retries on conflict)
        id: refresh
        continue-on-error: true  # alerts below must still run even if this ultimately fails to push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pushed=false
          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"
            python refresh_job.py
            python all_cards_history.py
            python news_signals.py

            git add docs/watchlist.json docs/movers.json docs/alerts.json
            git diff --cached --quiet || git commit -m "Nightly price refresh"

            if git push; then
              echo "Pushed successfully on attempt $attempt"
              pushed=true
              break
            fi

            echo "Push rejected on attempt $attempt — resetting to remote and retrying"
            git fetch origin main
            git reset --hard origin/main
            # Neither database is git-tracked, so `reset --hard` above
            # doesn't touch them — no need to re-download either here.
          done

          if [ "$pushed" != true ]; then
            echo "Could not push docs data after 3 attempts" >&2
            exit 1
          fi

      # market_alerts.py sends Telegram messages, which are irreversible
      # and can't be "redone safely" the way the refresh above can. It
      # runs exactly once here, never inside a retry loop: re-running it
      # on retry would just resend everything. This happened for real:
      # one push conflict meant three nights' worth of alerts went out in
      # a single run (45 messages) before this was split out.
      # news_signals.py --early-warnings sends a Telegram alert for
      # leading-type signals (spoiler/ban/reprint) on cards that aren't
      # already a mover tonight — same "irreversible, never retried"
      # reasoning as market_alerts.py, so it runs here too, not inside
      # the retry-safe phase above.
      - name: Send market alerts and early warnings (runs once, never retried)
        id: alerts
        continue-on-error: true  # database upload below must still run even if this throws
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python market_alerts.py
          python news_signals.py --early-warnings

      # Runs regardless of whether the steps above succeeded, so
      # whatever each one managed to write locally (price refresh,
      # news signals, "already sent today" bookkeeping) still gets
      # persisted — same best-effort spirit the old git-based bookkeeping
      # push had, but as a single unconditional upload instead of a
      # second git push that could itself conflict.
      - name: Upload updated databases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Price history data" --notes "Persistent tcg_prices.db and all-cards price history (kept out of git history; not the same as source code releases)"
          gh release upload data tcg_prices.db all_cards_*.db --clobber

      # Surfaced last (after alerts/upload already ran regardless) so the
      # price-refresh step's own failure doesn't block them, but still
      # marks the overall job red so a real push problem doesn't go
      # unnoticed.
      - name: Fail the job if docs data never pushed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Docs-data push failed earlier in this run (see 'Refresh price data and news signals, then push docs' step above) — alerts were still sent and the databases were still uploaded." >&2
          exit 1

      - name: Fail the job if sending alerts/early warnings crashed
        if: steps.alerts.outcome == 'failure'
        run: |
          echo "market_alerts.py or news_signals.py --early-warnings threw an error earlier in this run (see 'Send market alerts and early warnings' step above) — database upload still ran regardless." >&2
          exit 1
