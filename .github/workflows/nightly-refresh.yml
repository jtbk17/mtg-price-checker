name: Nightly price refresh

on:
  schedule:
    # 07:00 UTC = 15:00 (3pm) SGT — MTGJSON's price feed refreshes ~06:00-06:10
    # UTC daily, so this runs after that day's fresh data actually lands
    # (the old 18:00 UTC / 2am SGT slot was pulling the *previous* day's prices)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests ijson scikit-learn

      - name: Refresh watchlist prices and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refresh_job.py

      - name: Download existing all-cards database, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data --pattern "all_cards_*.db" --clobber || true

      - name: Snapshot all-card prices and compute movers
        run: python all_cards_history.py

      - name: Send market-wide mover alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_alerts.py

      - name: Commit updated watchlist + movers data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tcg_prices.db docs/watchlist.json docs/movers.json docs/alerts.json
          git diff --cached --quiet || git commit -m "Nightly price refresh"
          git pull --rebase
          git push

      - name: Upload updated all-cards database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Price history data" --notes "Persistent all-cards price history (kept out of git history; not the same as source code releases)"
          gh release upload data all_cards_*.db --clobber
