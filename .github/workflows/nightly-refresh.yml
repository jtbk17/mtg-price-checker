name: Nightly price refresh

on:
  schedule:
    # 07:00 UTC = 15:00 (3pm) SGT — MTGJSON's price feed refreshes ~06:00-06:10
    # UTC daily, so this runs after that day's fresh data actually lands
    # (the old 18:00 UTC / 2am SGT slot was pulling the *previous* day's prices)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests ijson scikit-learn

      - name: Download existing all-cards database, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data --pattern "all_cards_*.db" --clobber || true

      # tcg_prices.db is a SQLite binary, so git can't merge two divergent
      # writes to it (e.g. this job vs. a feedback-button dispatch landing
      # around the same time) the way it can with text. On a rejected push,
      # reset to the remote's latest state and re-run the whole pipeline
      # rather than attempting a doomed merge. This is safe to repeat:
      # refresh_job.py/all_cards_history.py are idempotent, and
      # market_alerts.py / the watchlist alert step both skip sending twice
      # in the same day (see db.already_ran_today), so a retry can't double
      # up your Telegram alerts.
      - name: Run pipeline and push (retries on conflict)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"
            python refresh_job.py
            python all_cards_history.py
            python market_alerts.py

            git add tcg_prices.db docs/watchlist.json docs/movers.json docs/alerts.json
            git diff --cached --quiet || git commit -m "Nightly price refresh"

            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi

            echo "Push rejected on attempt $attempt — resetting to remote and retrying"
            git fetch origin main
            git reset --hard origin/main
            # all_cards_*.db is gitignored/untracked, so `reset --hard` above
            # doesn't touch it — no need to re-download it here.
          done

          echo "Could not push after 3 attempts" >&2
          exit 1

      - name: Upload updated all-cards database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Price history data" --notes "Persistent all-cards price history (kept out of git history; not the same as source code releases)"
          gh release upload data all_cards_*.db --clobber
