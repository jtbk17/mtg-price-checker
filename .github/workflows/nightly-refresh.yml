name: Nightly price refresh

on:
  schedule:
    # 18:00 UTC = 02:00 SGT the next day
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python refresh_job.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tcg_prices.db docs/watchlist.json
          git diff --cached --quiet || git commit -m "Nightly price refresh"
          git push
