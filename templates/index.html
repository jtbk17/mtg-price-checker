<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Price Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>MTG Price Checker</h1>
    <p class="subtitle">Magic: The Gathering &mdash; Card Kingdom market &amp; buylist prices</p>
    <label class="owner-field">
      Tracking as
      <input type="text" id="current-owner" placeholder="Your name" list="known-owners">
      <datalist id="known-owners"></datalist>
    </label>
  </header>

  <main>
    <section class="panel" id="search-panel">
      <h2>Search</h2>
      <form id="search-form">
        <div class="search-input-wrap">
          <input type="text" id="search-input" placeholder="Card name, e.g. Lightning Bolt" autocomplete="off" required>
          <div id="search-suggestions" class="suggestions" hidden></div>
        </div>
        <button type="submit">Search</button>
      </form>
      <div id="search-error" class="error" hidden></div>
      <div id="search-results" class="card-grid"></div>
    </section>

    <section class="panel" id="watchlist-panel">
      <div class="panel-header">
        <div>
          <h2>Watchlist</h2>
          <p id="portfolio-value" class="section-sub"></p>
        </div>
        <div class="panel-actions">
          <select id="owner-filter">
            <option value="">All owners</option>
          </select>
          <form id="import-form">
            <label class="file-btn">
              Import ManaBox CSV
              <input type="file" id="import-input" accept=".csv" hidden>
            </label>
          </form>
          <button id="refresh-btn" type="button">Refresh prices</button>
        </div>
      </div>
      <div id="import-status" class="error" hidden></div>
      <div id="watchlist-error" class="error" hidden></div>
      <div id="watchlist" class="card-grid"></div>
    </section>

  </main>

  <dialog id="history-dialog">
    <h3 id="history-title"></h3>
    <canvas id="history-chart" width="480" height="220"></canvas>
    <button id="close-history" type="button">Close</button>
  </dialog>

  <dialog id="add-copies-dialog">
    <h3 id="add-copies-title">Add more copies</h3>
    <form id="add-copies-form" class="dialog-form">
      <label>
        Quantity to add
        <input type="number" id="add-copies-qty" min="1" value="1" required>
      </label>
      <label>
        Cost per card (optional)
        <input type="number" id="add-copies-cost" min="0" step="0.01" placeholder="What you paid">
      </label>
      <div id="add-copies-error" class="error" hidden></div>
      <div class="actions">
        <button type="submit">Add</button>
        <button type="button" id="close-add-copies" class="secondary">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
