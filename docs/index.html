<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Price Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e38;
      --text: #e8e9ec;
      --muted: #9096a3;
      --up: #4caf6d;
      --down: #e5534b;
      --ck: #d4a24c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { padding: 24px 32px 8px; }
    header h1 { margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0; }
    main { padding: 16px 32px 48px; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #12141a;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-image { width: 100%; border-radius: 6px; display: block; }
    .card .name { font-weight: 700; }
    .card .meta { color: var(--muted); font-size: 0.85em; }
    .card .price { font-size: 1.3em; font-weight: 700; }
    .card .delta.up { color: var(--up); }
    .card .delta.down { color: var(--down); }
    .card .ck-buylist { color: var(--ck); }
    .empty { color: var(--muted); }
    canvas { width: 100%; height: 60px; margin-top: 4px; }
    section { margin-bottom: 36px; }
    section h2 { margin: 0 0 4px; font-size: 1.1em; }
    section .section-sub { color: var(--muted); font-size: 0.85em; margin: 0 0 12px; }
    .movers-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    table.movers { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    table.movers th, table.movers td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    table.movers th { color: var(--muted); font-weight: 600; font-size: 0.85em; }
    table.movers td.pct.up { color: var(--up); font-weight: 700; }
    table.movers td.pct.down { color: var(--down); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>MTG Price Tracker</h1>
    <p class="subtitle" id="subtitle">Card Kingdom market &amp; buylist prices, refreshed nightly</p>
  </header>
  <main>
    <section>
      <h2>Watchlist</h2>
      <div id="watchlist" class="card-grid"><p class="empty">Loading…</p></div>
    </section>

    <section>
      <h2>Market movers</h2>
      <p class="section-sub" id="movers-sub">Across every Card Kingdom-priced card, updated nightly</p>
      <div class="movers-columns">
        <div>
          <h3>Today</h3>
          <table class="movers">
            <thead><tr><th>Gainers</th><th></th></tr></thead>
            <tbody id="daily-gainers"></tbody>
          </table>
          <table class="movers" style="margin-top:12px">
            <thead><tr><th>Losers</th><th></th></tr></thead>
            <tbody id="daily-losers"></tbody>
          </table>
        </div>
        <div>
          <h3>This week</h3>
          <table class="movers">
            <thead><tr><th>Gainers</th><th></th></tr></thead>
            <tbody id="weekly-gainers"></tbody>
          </table>
          <table class="movers" style="margin-top:12px">
            <thead><tr><th>Losers</th><th></th></tr></thead>
            <tbody id="weekly-losers"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    function formatPrice(price) {
      if (price === null || price === undefined) return "—";
      return `$${Number(price).toFixed(2)}`;
    }

    function deltaInfo(latest, previous) {
      if (latest == null || previous == null) return null;
      const diff = latest - previous;
      if (Math.abs(diff) < 0.005) return null;
      const pct = (diff / previous) * 100;
      const direction = diff > 0 ? "up" : "down";
      const sign = diff > 0 ? "+" : "";
      return { direction, text: `${sign}${diff.toFixed(2)} (${sign}${pct.toFixed(1)}%)` };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function drawSparkline(canvas, history) {
      const ctx = canvas.getContext("2d");
      canvas.width = canvas.clientWidth * 2;
      canvas.height = canvas.clientHeight * 2;
      const { width, height } = canvas;
      ctx.clearRect(0, 0, width, height);
      const prices = history.map((h) => h.price).filter((p) => p != null);
      if (prices.length < 2) return;
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;
      ctx.strokeStyle = "#5b8cff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      history.forEach((point, i) => {
        const x = (i / (history.length - 1)) * width;
        const y = height - ((point.price - min) / range) * height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function renderMoversTable(tbodyId, movers) {
      const tbody = document.getElementById(tbodyId);
      if (!movers.length) {
        tbody.innerHTML = '<tr><td colspan="2" class="empty">No data yet</td></tr>';
        return;
      }
      tbody.innerHTML = movers
        .map((m) => {
          const direction = m.pct_change >= 0 ? "up" : "down";
          const sign = m.pct_change >= 0 ? "+" : "";
          return `
            <tr>
              <td>${escapeHtml(m.name)} <span class="meta">(${escapeHtml(m.set || "")})</span></td>
              <td class="pct ${direction}">${sign}${m.pct_change}% <span class="meta">${formatPrice(m.price_before)} → ${formatPrice(m.price_now)}</span></td>
            </tr>
          `;
        })
        .join("");
    }

    async function loadMovers() {
      try {
        const resp = await fetch("movers.json", { cache: "no-store" });
        const data = await resp.json();
        if (data.generated_at) {
          document.getElementById("movers-sub").textContent =
            `Across every Card Kingdom-priced card — last updated ${new Date(data.generated_at).toLocaleString()}`;
        }
        renderMoversTable("daily-gainers", data.daily_gainers || []);
        renderMoversTable("daily-losers", data.daily_losers || []);
        renderMoversTable("weekly-gainers", data.weekly_gainers || []);
        renderMoversTable("weekly-losers", data.weekly_losers || []);
      } catch (err) {
        document.getElementById("movers-sub").textContent = `Couldn't load movers: ${err.message}`;
      }
    }

    async function load() {
      const container = document.getElementById("watchlist");
      try {
        const resp = await fetch("watchlist.json", { cache: "no-store" });
        const data = await resp.json();

        if (data.generated_at) {
          const dt = new Date(data.generated_at);
          document.getElementById("subtitle").textContent =
            `Card Kingdom market & buylist prices — last updated ${dt.toLocaleString()}`;
        }

        if (!data.items.length) {
          container.innerHTML = '<p class="empty">Nothing tracked yet.</p>';
          return;
        }

        container.innerHTML = "";
        data.items.forEach((item) => {
          const delta = deltaInfo(item.latest_price, item.previous_price);
          const el = document.createElement("div");
          el.className = "card";
          el.innerHTML = `
            ${item.image_url ? `<img class="card-image" src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.name || "")}">` : ""}
            <div class="name">${escapeHtml(item.name)}</div>
            <div class="meta">${escapeHtml(item.set_name || "")}</div>
            <div class="meta">${escapeHtml(item.printing || "")}</div>
            <div class="price">${formatPrice(item.latest_price)}</div>
            ${delta ? `<div class="delta ${delta.direction}">${delta.text}</div>` : ""}
            <div class="meta ck-buylist">Card Kingdom buylist: ${formatPrice(item.cardkingdom_buylist_price)}</div>
            <canvas></canvas>
          `;
          container.appendChild(el);
          if (item.history && item.history.length > 1) {
            drawSparkline(el.querySelector("canvas"), item.history);
          }
        });
      } catch (err) {
        container.innerHTML = `<p class="empty">Couldn't load price data: ${escapeHtml(err.message)}</p>`;
      }
    }

    load();
    loadMovers();
  </script>
</body>
</html>
